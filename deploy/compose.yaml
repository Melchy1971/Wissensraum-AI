# Wissensraum-AI Server auf dem VPS (Release 3.0, Schritt 10.8, D-029).
# Erreichbar nur aus dem WireGuard-Netz: Traefik terminiert HTTPS, die Middleware lässt nur VPN-Adressen zu.
# Netze, Entrypoint, Zertifikat und VPN-Middleware sind die Werte des VPS (Stand 11.11.2026), siehe deploy/BETRIEB.md.
name: wissensraum

services:
  migrate:
    image: wissensraum-server:3.0
    build: ..
    command: ["python", "server.py", "migrate"]
    env_file: wissensraum.env
    environment:
      DB_MIGRATION_USERNAME: wissensraum_owner
      DB_MIGRATION_PASSWORD_FILE: /run/secrets/db_owner
    secrets: [db_owner, db_app]
    networks: [datenbank]
    restart: "no"

  server:
    image: wissensraum-server:3.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: wissensraum.env
    secrets: [db_app, oidc_client_secret, mail_key]
    environment:
      WISSENSRAUM_OCR: "0"  # Texterkennung nur im Worker (Paritäts-Roadmap Phase 6)
    volumes:
      - logs:/data/logs
      - exports:/data/exports
    networks: [datenbank, proxy]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.wissensraum.rule: Host(`wissen.melchy.cloud`)
      traefik.http.routers.wissensraum.entrypoints: websecure
      traefik.http.routers.wissensraum.tls.certresolver: letsencrypt
      # VPN-Sperre aus der Traefik-Dateikonfiguration des VPS (wissen-vpn-only, nur 10.13.13.0/24), Stand 11.11.2026
      traefik.http.routers.wissensraum.middlewares: wissen-vpn-only@file,wissensraum-groesse
      # S-09: Obergrenze für den Anfragekörper vor dem Server (Upload 100 MB plus Formularrahmen), auch ohne Content-Length.
      traefik.http.middlewares.wissensraum-groesse.buffering.maxRequestBodyBytes: "110000000"
      traefik.http.services.wissensraum.loadbalancer.server.port: "8000"

  # Hintergrundarbeiten (Paritäts-Roadmap Phase 2, 3, 5, 6): Einbettung, Uploads samt Texterkennung, Installationsexport.
  # Gleiches Image und gleiche Datenbankrolle wie server, kein Port, keine Benutzeranmeldung. Genau ein Worker.
  worker:
    image: wissensraum-server:3.0
    command: ["python", "worker.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: wissensraum.env
    # mail_key und oidc_client_secret: Postfachabrufe im Auftrag der Konten (Phase 8, D-030).
    secrets: [db_app, oidc_client_secret, mail_key]
    volumes:
      - worker-logs:/data/logs
      - exports:/data/exports
    # Der Worker braucht PostgreSQL und Ollama. Liegt Ollama in einem anderen Netz als datenbank, dieses
    # Netz hier ergänzen. Nicht das Proxy-Netz: der Worker bietet nichts an.
    networks: [datenbank]
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Phase 6: Tesseract rechnet hier; eine Seite mit 300 dpi braucht einige hundert MB, /tmp liegt im Speicher.
    mem_limit: 1536m
    cpus: 1
    restart: unless-stopped
    stop_grace_period: 2m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    healthcheck:
      # Herzschlag nach jeder Runde; älter als drei Runden (WR_WORKER_INTERVAL, Standard 30 s) gilt als hängend.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time()-os.path.getmtime('/tmp/wissensraum-worker.alive') > 3*int(os.environ.get('WR_WORKER_INTERVAL') or 30)+60)"]
      interval: 60s
      timeout: 5s
      start_period: 2m
      retries: 3

secrets:
  db_owner: {file: ./secrets/db_owner.txt}
  db_app: {file: ./secrets/db_app.txt}
  oidc_client_secret: {file: ./secrets/oidc_client_secret.txt}
  # 32 Zufallsbytes als Base64 (openssl rand -base64 32), Kopie mit age außerhalb des VPS (D-030)
  mail_key: {file: ./secrets/mail_key.txt}

volumes:
  logs:
  worker-logs:
  exports:  # Installationsexport des Workers, Server liefert ihn an Admins aus, gelöscht nach einem Tag

networks:
  datenbank: {external: true, name: backend}
  proxy: {external: true, name: proxy}
