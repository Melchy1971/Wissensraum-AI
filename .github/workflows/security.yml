name: Security
# Release 2.4, step 9.5: known vulnerabilities in dependencies, secrets in the whole history and
# high-severity findings in the code block the merge and the release; a software bill of materials
# (CycloneDX) is produced for every run.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1
      - name: Known vulnerabilities (OSV/PyPI advisories)
        run: |
          pip-audit -r requirements-ocr.txt
          pip-audit -r requirements-server.txt
          pip-audit --no-deps -r requirements-pst.txt
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the full history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Authenticated download with retries: an anonymous curl got error pages under the
          # download limit and only the checksum caught it (08.11.2026).
          for attempt in 1 2 3 4 5; do
            gh release download v8.28.0 -R gitleaks/gitleaks -p gitleaks_8.28.0_linux_x64.tar.gz -O gitleaks.tgz --clobber && break
            sleep $((attempt * 10))
          done
          ls -l gitleaks.tgz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact -c .gitleaks.toml .
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install bandit==1.9.4
      - name: Report of all findings
        run: bandit -q -r . -x ./tests -f json -o bandit.json || true
      - name: High severity blocks
        run: bandit -q -r . -x ./tests -lll
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit.json
          retention-days: 30
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: CycloneDX from an environment with exactly the application dependencies
        run: |
          python -m venv app-env
          app-env/bin/python -m pip install -q -r requirements-ocr.txt -r requirements-server.txt
          python -m pip install cyclonedx-bom==8.0.1
          cyclonedx-py environment app-env/bin/python --output-format JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
