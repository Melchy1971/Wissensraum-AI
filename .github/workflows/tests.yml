name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py core.py cli.py settings.py
      - name: Tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Tests with virtual display on Linux
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          xvfb-run -a python -m unittest discover -s tests -v
      - name: Capture settings interface with synthetic credentials
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: |
          python -m pip install Pillow==11.3.0
          xvfb-run -a python tests/capture_settings.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        with:
          name: settings-interface
          path: settings-preview.png
          retention-days: 7
