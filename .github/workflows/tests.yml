name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # OCR packages everywhere; the Tesseract program only on Linux. Windows thus checks
      # the supported state "packages installed, program missing" (OCR tests skip there).
      - run: python -m pip install -r requirements-ocr.txt -r requirements-server.txt
      - run: python -m compileall -q app.py core.py cli.py database.py design.py settings.py importer.py migrations.py configuration.py configuration_authority.py diagnostics.py local_logging.py import_jobs.py mail_structure.py mail_cleanup.py ocr.py accounts.py sessions.py oidc.py server.py
      - name: Tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Install Tesseract with German and English on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng fonts-dejavu-core
          tesseract --version
          tesseract --list-langs
      - name: Tests with virtual display on Linux
        if: runner.os == 'Linux'
        env:
          WISSENSRAUM_REQUIRE_OCR: '1'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Capture settings interface with synthetic credentials
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: |
          xvfb-run -a python tests/capture_settings.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        with:
          name: settings-interface
          path: |
            settings-preview.png
            import-preview.png
            accounts-preview.png
            email-preview.png
            database-preview.png
            design-preview.png
          retention-days: 7
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wissensraum_test
          POSTGRES_USER: wissensraum_test
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wissensraum_test -d wissensraum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-server.txt
      - name: Install PostgreSQL 18 client tools (pg_dump/pg_restore must match the server)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
      - name: PostgreSQL contract test
        env:
          PGTEST_PASSWORD: synthetic-ci-password
          PGTEST_DATABASE: wissensraum_test
          PGTEST_ALLOW_DESTRUCTIVE: '1'
          PGTEST_PG_BIN: /usr/lib/postgresql/18/bin
          PGTEST_REQUIRE_PG_TOOLS: '1'
        run: python -m unittest tests.test_postgres -v
