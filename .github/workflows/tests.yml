name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py core.py cli.py database.py settings.py importer.py
      - name: Tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Tests with virtual display on Linux
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          xvfb-run -a python -m unittest discover -s tests -v
      - name: Capture settings interface with synthetic credentials
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: |
          python -m pip install Pillow==11.3.0
          xvfb-run -a python tests/capture_settings.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        with:
          name: settings-interface
          path: |
            settings-preview.png
            import-preview.png
            accounts-preview.png
            email-preview.png
            database-preview.png
          retention-days: 7
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wissensraum_test
          POSTGRES_USER: wissensraum_test
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wissensraum_test -d wissensraum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: PostgreSQL contract test
        env:
          PGTEST_PASSWORD: synthetic-ci-password
        run: python -m unittest tests.test_postgres -v
