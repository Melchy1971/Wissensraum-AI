{% extends "base.html" %}
{% block content %}
<form hx-post="/hochladen" hx-encoding="multipart/form-data" hx-target="#upload-result">
<input type="file" name="file" required>
<label>Bereich <input name="category" value="Allgemein" maxlength="100" required></label>
<button type="submit">Hochladen</button>
</form>
<div id="upload-result"></div>
<p><small>Bis 50 MB. Bilder brauchen die Texterkennung und werden im Server noch nicht angenommen.</small></p>
{% endblock %}
