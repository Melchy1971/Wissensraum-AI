{% extends "base.html" %}
{% block content %}
{% if account.role in ('admin', 'editor') %}
<form method="post" action="/sammlungen"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Neue Sammlung <input name="name" maxlength="100" required></label> <button type="submit">Anlegen</button></form>
{% endif %}
<ul>
{% for c in collections %}
<li><a href="/sammlungen/{{ c.id }}">{{ c.name }}</a> ({{ c.documents }} Dokumente) · <a href="/api/collections/{{ c.id }}/export">Export</a></li>
{% else %}
<li>Keine Sammlungen freigegeben.</li>
{% endfor %}
</ul>
{% endblock %}
